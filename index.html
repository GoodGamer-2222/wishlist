<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Birthday Wishlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">◆</span><span id="site-title">Birthday Wishlist</span></a>
    <div class="header-right"><span class="header-note" id="birthday-note"></span><a class="admin-link" href="admin/">Admin</a></div>
  </header>
  <main class="page-shell">
    <section class="hero">
      <div class="eyebrow"><span class="eyebrow-dot"></span> THE WISHLIST</div>
      <h1>A little list of<br><span>things I'd love.</span></h1>
      <p class="hero-copy" id="intro-copy">A collection of birthday ideas. Thanks for taking a look!</p>
      <div class="hero-meta"><span id="item-count">0 items</span><span class="meta-divider"></span><span id="total-value">Total listed value: —</span></div>
    </section>
    <section class="toolbar" aria-label="Wishlist controls">
      <label class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Find something…" autocomplete="off"></label>
      <select id="category-filter" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="sort" aria-label="Sort items">
        <option value="custom">Featured order</option><option value="priority">Priority</option>
        <option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option>
        <option value="name">Name: A–Z</option>
      </select>
    </section>
    <div id="status" class="status-line" role="status">Loading wishlist…</div>
    <section id="wishlist" class="product-grid" aria-live="polite"></section>
    <section id="empty-state" class="empty-state" hidden><h2>Nothing here just yet</h2><p>Check back soon!</p></section>
    <footer class="site-footer"><span>Made with a little birthday excitement</span><span id="footer-year"></span></footer>
  </main>
  <dialog class="product-viewer" id="product-viewer" aria-label="Product details">
    <div class="viewer-shell">
      <button class="viewer-close" id="viewer-close" type="button" aria-label="Close product details">×</button>
      <button class="viewer-arrow viewer-prev" id="viewer-prev" type="button" aria-label="Previous product">‹</button>
      <div class="viewer-layout">
        <div class="viewer-photo-wrap"><img id="viewer-image" alt=""><div class="viewer-image-placeholder" id="viewer-image-placeholder" hidden>No photo available</div></div>
        <div class="viewer-info">
          <div class="card-top"><span class="category-tag" id="viewer-category"></span><span class="priority-tag" id="viewer-priority"></span></div>
          <h2 id="viewer-title"></h2>
          <p class="viewer-description" id="viewer-description"></p>
          <div class="price-row"><span class="price" id="viewer-price"></span><span class="quantity" id="viewer-quantity"></span></div>
          <div class="viewer-links" id="viewer-links"></div>
          <div class="viewer-position" id="viewer-position"></div>
        </div>
      </div>
      <button class="viewer-arrow viewer-next" id="viewer-next" type="button" aria-label="Next product">›</button>
    </div>
  </dialog>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
